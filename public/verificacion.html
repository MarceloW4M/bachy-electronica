<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Verificación de Cliente (móvil)</title>
  <style>
    :root{--bg:#f6f8fb;--card:#fff;--accent:#0b84ff;--text:#0f172a;--muted:#55606a;--radius:14px}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#f8fbff, var(--bg));color:var(--text)}
    .wrap{max-width:520px;margin:0 auto;padding:16px}
    .card{background:var(--card);border-radius:12px;padding:14px;box-shadow:0 6px 18px rgba(10,20,40,0.08)}
    .hero{ text-align:center; margin:0 0 10px }
    .hero .greet{ font-size:34px; margin:0; font-weight:400 }
    .hero .subtitle{ font-size:18px; margin:6px 0 0; color:var(--muted); font-weight:400 }
    p.lead{margin:0 0 12px;color:var(--muted);font-size:13px;text-align:center}
    .row{display:flex;gap:8px}
    input,select,button,textarea{font:inherit}
    input,select,textarea{width:100%;padding:10px 12px;border:1px solid #dde6f2;border-radius:10px}
    .compact{padding:8px}
    .lookup{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}
    .lookup.lookup-inline{display:flex;gap:8px;align-items:center;margin-bottom:10px}
    .lookup.lookup-inline input{flex:1}
    .btn.compact{padding:8px 10px;font-size:14px}
    .small{font-size:13px;color:var(--muted)}
    .actions{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
    .btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-secondary{background:#eef3fb;color:var(--text)}
    .field{margin-bottom:8px}
    label{display:block;font-size:12px;margin-bottom:6px;color:var(--muted);font-weight:700}
    .status{font-size:13px;margin-top:8px}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;padding:10px 14px;border-radius:10px;color:#fff;display:none}
    .toast.visible{display:block}
    /* confirm modal */
    .confirm-overlay{position:fixed;inset:0;background:rgba(6,12,24,0.5);display:none;align-items:center;justify-content:center;z-index:9999}
    .confirm-overlay.visible{display:flex}
    .confirm-card{background:var(--card);padding:20px;border-radius:12px;text-align:center;max-width:360px;box-shadow:0 10px 30px rgba(10,20,40,0.12)}
    .confirm-card .title{font-size:18px;color:var(--text);margin-bottom:8px}
    .confirm-card .name{font-size:16px;color:var(--accent);font-weight:700}
    @media(max-width:420px){.wrap{padding:10px}.card{padding:12px}} 
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-label="Verificación cliente móvil">
      <div class="hero">
        <div class="greet">Hola</div>
        <div class="subtitle">Vamos a verificar tus datos !!</div>
      </div>
      <p class="lead">Buscá por DNI o teléfono. Podés corregir datos y guardar los cambios.</p>

      <div class="lookup lookup-inline">
        <input id="lookup_input" inputmode="numeric" maxlength="11" placeholder="DNI o teléfono" aria-label="DNI o teléfono">
        <button id="btnLookupDni" class="btn btn-primary compact">Buscar</button>
        <button id="btnClear" class="btn btn-secondary compact">Limpiar</button>
      </div>

      <form id="verifyForm" class="hidden">
        <div class="field">
          <label for="name">Nombre</label>
          <input id="name" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="dni_cuit">DNI / CUIT</label>
          <input id="dni_cuit" inputmode="numeric">
        </div>
        <div class="field">
          <label for="phone">Teléfono</label>
          <input id="phone" inputmode="tel">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email">
        </div>
        <div class="field">
          <label for="address">Dirección</label>
          <input id="address">
        </div>
        <div class="row">
          <div style="flex:1" class="field">
            <label for="province_id">Provincia</label>
            <select id="province_id"><option value="">Cargando...</option></select>
          </div>
          <div style="width:140px" class="field">
            <label for="city_id">Ciudad</label>
            <select id="city_id"><option value="">-</option></select>
          </div>
        </div>

        <div class="field">
          <label for="contact_name">Contacto adicional</label>
          <input id="contact_name" placeholder="Nombre (opcional)">
        </div>
        <div class="field">
          <label for="contact_phone">Teléfono contacto</label>
          <input id="contact_phone" inputmode="tel" placeholder="(opcional)">
        </div>

        <div class="actions">
          <button id="btnSave" class="btn btn-primary" type="button">Guardar</button>
        </div>
        <div id="formStatus" class="status small"></div>
      </form>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <div id="confirmOverlay" class="confirm-overlay" role="dialog" aria-modal="true">
    <div class="confirm-card">
      <div class="title">Gracias por validar tus datos.</div>
      <div id="confirmName" class="name"></div>
    </div>
  </div>

  <script>
    const apiBase = '/api/customers.php';
    const provincesApi = '/api/provinces.php';
    const citiesApi = '/api/cities.php';
    const lookupInput = document.getElementById('lookup_input');
    const btnLookupDni = document.getElementById('btnLookupDni');
    const btnClear = document.getElementById('btnClear');
    const verifyForm = document.getElementById('verifyForm');
    const btnSave = document.getElementById('btnSave');
    const toast = document.getElementById('toast');
    const formStatus = document.getElementById('formStatus');

    const fields = ['name','dni_cuit','phone','email','address','province_id','city_id','contact_name','contact_phone'];
    let currentCustomer = null;
    let provinces = [];

    function showToast(msg, kind='success'){
      toast.textContent = msg; toast.style.background = kind==='error'?'#b42318':'#16703a'; toast.className='toast visible';
      setTimeout(()=>{toast.className='toast';},3500);
    }

    function setFormVisible(visible){
      verifyForm.style.display = visible ? 'block' : 'none';
    }

    async function loadProvinces(){
      try{const r=await fetch(provincesApi); provinces=await r.json(); const sel=document.getElementById('province_id'); sel.innerHTML='<option value="">-- Seleccionar --</option>'; provinces.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;sel.appendChild(o)}); }catch(e){console.error(e)}
    }

    async function loadCities(provinceId, selected){
      const sel=document.getElementById('city_id'); sel.innerHTML='<option value="">Cargando...</option>'; if(!provinceId){ sel.innerHTML='<option value="">-</option>'; return; }
      try{const r=await fetch(citiesApi+'?province_id='+encodeURIComponent(provinceId)); const rows=await r.json(); sel.innerHTML='<option value="">-- Seleccionar --</option>'; rows.forEach(c=>{const o=document.createElement('option'); o.value=c.id; o.textContent=c.name; sel.appendChild(o)}); if(selected) sel.value=selected; }catch(e){console.error(e); sel.innerHTML='<option value="">-</option>'}
    }

    function populateForm(data){
      currentCustomer = data; setFormVisible(true); formStatus.textContent='';
      fields.forEach(k=>{ const el=document.getElementById(k); if(!el) return; el.value = data[k]===null||data[k]===undefined?'':data[k]; });
      if(data.province_id){ document.getElementById('province_id').value=data.province_id; loadCities(data.province_id, data.city_id); } else { document.getElementById('city_id').innerHTML='<option value="">-</option>'}
    }

    async function lookup(){
      const v = lookupInput.value.trim(); if(!v){ showToast('Ingresá DNI o teléfono', 'error'); return; }
      const digits = v.replace(/\D/g,'');
      formStatus.textContent='Buscando...';
      try{
        let res=null;
        if(digits.length>=7 && digits.length<=11){
          const r = await fetch(apiBase+'?dni='+encodeURIComponent(digits)); res = await r.json();
        }
        if(!res){
          const r2 = await fetch(apiBase+'?phone='+encodeURIComponent(v)); res = await r2.json();
        }
        if(!res){ setFormVisible(false); formStatus.textContent='No se encontró cliente.'; showToast('Cliente no encontrado', 'error'); currentCustomer=null; return; }
        populateForm(res);
      }catch(e){ console.error(e); showToast('Error de red', 'error'); }
    }

    async function saveChanges(){
      if(!currentCustomer || !currentCustomer.id){ showToast('Primero cargá un cliente', 'error'); return; }
      const payload = {};
      fields.forEach(k=>{ const el=document.getElementById(k); if(!el) return; payload[k]=el.value.trim(); });
      // mark as validated in the customers list
      payload.validar = 1;
      formStatus.textContent='Guardando...';
      try{
        const resp = await fetch(apiBase+'?id='+encodeURIComponent(currentCustomer.id), { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
        const js = await resp.json();
        if(resp.ok){
          // actualizar cliente actual con los valores enviados
          Object.assign(currentCustomer, payload);
          formStatus.textContent='Guardado';
          // mostrar modal de confirmación con el nombre
          showConfirmModal(payload.name || currentCustomer.name || '');
        } else {
          showToast(js.error||'Error', 'error'); formStatus.textContent=js.error||'Error';
        }
      }catch(e){ console.error(e); showToast('Error al guardar', 'error'); formStatus.textContent='Error'; }
    }

    function showConfirmModal(name){
      const overlay = document.getElementById('confirmOverlay');
      const nameEl = document.getElementById('confirmName');
      nameEl.textContent = name || '';
      overlay.classList.add('visible');
      // after 3 seconds attempt to close window
      setTimeout(()=>{
        try{
          // try best-effort close; some browsers block closing tabs not opened by script
          window.open('','_self'); window.close();
        }catch(_){ /* ignore */ }
        // fallback: navigate away
        try{ location.href = 'about:blank'; }catch(_){ /* ignore */ }
      }, 3000);
    }


    btnLookupDni.addEventListener('click', lookup);
    btnClear.addEventListener('click', ()=>{ lookupInput.value=''; setFormVisible(false); currentCustomer=null; formStatus.textContent=''; });
    btnSave.addEventListener('click', saveChanges);
    document.getElementById('province_id').addEventListener('change', e=>{ loadCities(e.target.value); });

    // allow only digits in lookup input
    lookupInput.addEventListener('input', (e)=>{ const v = e.target.value.replace(/\D+/g,''); if (v !== e.target.value) e.target.value = v; });
    // allow paste only if clipboard contains only digits
    lookupInput.addEventListener('paste', (e)=>{
      const paste = (e.clipboardData || window.clipboardData).getData('text') || '';
      if (!/^\d+$/.test(paste)) {
        e.preventDefault();
        showToast('Solo se permite pegar números', 'error');
      }
    });

    (async ()=>{ await loadProvinces(); setFormVisible(false); })();
  </script>
</body>
</html>
