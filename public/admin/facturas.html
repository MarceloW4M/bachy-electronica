<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Facturas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/admin.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="adminNavbar"></div>
  <script src="/admin/navbar.js"></script>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4">Facturación</h1>
      <div>
        <button id="btnNewInvoice" class="btn btn-primary">Nueva factura</button>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <h6 class="mb-3">Facturas recientes</h6>
        <div class="table-responsive">
          <table class="table table-sm" id="invoicesTable">
            <thead class="table-light"><tr><th>ID</th><th>Total</th><th>Fecha</th><th class="text-end">Acciones</th></tr></thead>
            <tbody id="invoicesList"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Crear Factura -->
  <div class="modal fade" id="invoiceModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Nueva Factura</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Cliente</label>
            <select id="customerSelect" class="form-select"></select>
          </div>
          <div class="row g-2 align-items-end mb-2">
            <div class="col-md-8">
              <label class="form-label">Agregar artículo</label>
              <select id="itemSelect" class="form-select"></select>
            </div>
            <div class="col-md-4 d-grid">
              <button id="btnAddItem" class="btn btn-outline-primary">Agregar</button>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-sm" id="invoiceItems">
              <thead class="table-light"><tr><th>Artículo</th><th style="width:120px">Cantidad</th><th style="width:140px">Precio unit.</th><th style="width:80px"></th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button id="btnCreateInvoice" class="btn btn-success">Crear factura</button>
        </div>
      </div>
    </div>
  </div>

  <div class="position-fixed bottom-0 end-0 p-3" style="z-index:1200">
    <div id="toastContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/admin-utils.js"></script>
  <script>
    // Helpers
    function showToast(msg, type='info', timeout=3000){ try{ AdminUtils.showToast(msg,type,timeout); }catch(e){ alert(msg); } }

    document.addEventListener('DOMContentLoaded', async ()=>{
      const invoiceModalEl = document.getElementById('invoiceModal');
      const invoiceModal = new bootstrap.Modal(invoiceModalEl);

      async function loadInvoiceHelpers(){
        try{
          const [custRes, itemsRes] = await Promise.all([
            axios.get('/api/customers.php', { headers: getAuthHeaders() }),
            axios.get('/api/items.php?active=1', { headers: getAuthHeaders() })
          ]);
          const customers = custRes.data || [];
          const items = itemsRes.data || [];
          const customerSel = document.getElementById('customerSelect'); customerSel.innerHTML = '<option value="">Sin asignar</option>';
          customers.forEach(c=>{ const o=document.createElement('option'); o.value=c.id; o.text=c.name; customerSel.appendChild(o); });
          const itemSel = document.getElementById('itemSelect'); itemSel.innerHTML = ''; items.forEach(i=>{ const o=document.createElement('option'); o.value=i.id; o.text = i.name + (i.sku?(' ('+i.sku+')'): ''); itemSel.appendChild(o); });

          document.getElementById('btnAddItem').addEventListener('click', ()=>{
            const id = itemSel.value; const sel = items.find(x=>String(x.id)===String(id)); if(!sel) return;
            const tbody = document.querySelector('#invoiceItems tbody');
            const tr=document.createElement('tr');
            tr.innerHTML = `<td>${escapeHtml(sel.name)}</td><td><input class="form-control qty" value="1" type="number" min="1"></td><td><input class="form-control price" value="${Number(sel.unit_price||0).toFixed(2)}" type="number" step="0.01"></td><td><button class="btn btn-sm btn-danger btn-remove">X</button></td>`;
            tr.dataset.itemId = sel.id; tbody.appendChild(tr);
          });

          document.getElementById('invoiceItems').addEventListener('click',(e)=>{ if(e.target.classList.contains('btn-remove')) e.target.closest('tr').remove(); });

          document.getElementById('btnCreateInvoice').addEventListener('click', async ()=>{
            const customer_id = document.getElementById('customerSelect').value || null;
            const rows = Array.from(document.querySelectorAll('#invoiceItems tbody tr'));
            if(rows.length===0){ showToast('Agrega al menos un artículo','warning'); return; }
            const itemsPayload = rows.map(r=>({ item_id: r.dataset.itemId, quantity: parseInt(r.querySelector('.qty').value)||1, unit_price: parseFloat(r.querySelector('.price').value)||0 }));
            try{ const res = await axios.post('/api/invoices.php', { customer_id: customer_id, items: itemsPayload }, { headers: getAuthHeaders() }); showToast('Factura creada id=' + (res.data && res.data.id ? res.data.id : ''),'success'); invoiceModal.hide(); await loadInvoicesList(); }catch(e){ console.error(e); showToast('Error creando factura','danger'); }
          });

        }catch(e){ console.error('loadInvoiceHelpers',e); }
      }

      async function loadInvoicesList(){ try{ const res = await axios.get('/api/invoices.php', { headers: getAuthHeaders() }); const tbody = document.getElementById('invoicesList'); tbody.innerHTML=''; (res.data||[]).forEach(q=>{ const tr=document.createElement('tr'); tr.innerHTML=`<td>${q.id}</td><td>${Number(q.total||0).toFixed(2)}</td><td>${q.created_at||''}</td><td class="text-end"><a class="btn btn-sm btn-primary" href="/admin/facturas.html?id=${q.id}">Ver</a></td>`; tbody.appendChild(tr); }); }catch(e){ console.error('loadInvoicesList',e); }}

      document.getElementById('btnNewInvoice').addEventListener('click', async ()=>{ try{ await loadInvoiceHelpers(); invoiceModal.show(); }catch(e){ console.error(e); } });

      // initial list
      await loadInvoicesList();
    });

    // small escape helper
    function escapeHtml(value){ return String(value||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  </script>
</body>
</html>
