<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Remitos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/admin.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="adminNavbar"></div>
  <script src="/admin/navbar.js"></script>
  <div class="container">
    <h1 class="h4 mb-3">Remitos</h1>
    <div class="card mb-3"><div class="card-body">
      <div class="row g-2 align-items-end">
        <div class="col-md-4"><label class="form-label">Destinatario</label><input id="recipient" class="form-control"></div>
        <div class="col-md-5"><label class="form-label">Agregar artículo</label><select id="itemSelect" class="form-select"></select></div>
        <div class="col-md-3"><button id="btnAddItem" class="btn btn-primary">Agregar</button></div>
      </div>
    </div></div>
    <div class="card"><div class="card-body">
      <table class="table"><thead><tr><th>Artículo</th><th>Cant</th><th></th></tr></thead><tbody id="remitoItems"></tbody></table>
      <div class="d-flex justify-content-end"><button id="btnCreateRemito" class="btn btn-success">Crear Remito</button></div>
    </div></div>
    <div class="card mt-3"><div class="card-body">
      <h5>Remitos recientes</h5>
      <table class="table"><thead><tr><th>ID</th><th>Total</th><th>Fecha</th></tr></thead><tbody id="remitosList"></tbody></table>
    </div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    async function loadRemitoHelpers(){
      const items = (await axios.get('/api/items.php?all=1')).data || [];
      const itemSel = document.getElementById('itemSelect'); itemSel.innerHTML='';
      items.forEach(i=>{ const o=document.createElement('option'); o.value=i.id; o.text=i.name + ' (' + (i.sku||'') + ')'; itemSel.appendChild(o); });
      document.getElementById('btnAddItem').addEventListener('click', ()=>{ const id=itemSel.value; const sel=items.find(x=>x.id==id); if(!sel) return; const tbody=document.getElementById('remitoItems'); const tr=document.createElement('tr'); tr.innerHTML=`<td>${sel.name}</td><td><input class="form-control qty" value="1" type="number" min="1"></td><td><button class="btn btn-sm btn-danger btn-remove">X</button></td>`; tr.dataset.itemId=sel.id; tbody.appendChild(tr); });
      document.getElementById('remitoItems').addEventListener('click', (e)=>{ if(e.target.classList.contains('btn-remove')) e.target.closest('tr').remove(); });
      document.getElementById('btnCreateRemito').addEventListener('click', async ()=>{ const recipient=document.getElementById('recipient').value||null; const rows=Array.from(document.querySelectorAll('#remitoItems tr')); if(rows.length===0){ alert('Agrega al menos un artículo'); return; } const itemsPayload=rows.map(r=>({ item_id:r.dataset.itemId, quantity: parseInt(r.querySelector('.qty').value)||1 })); try{ const res=await axios.post('/api/remitos.php', { recipient: recipient, items: itemsPayload }); alert('Remito creado id=' + res.data.id); location.reload(); }catch(e){ alert('Error creando remito'); } });
      loadRemitosList();
    }
    async function loadRemitosList(){ try{ const res=await axios.get('/api/remitos.php'); const tbody=document.getElementById('remitosList'); tbody.innerHTML=''; (res.data||[]).forEach(r=>{ const tr=document.createElement('tr'); tr.innerHTML=`<td>${r.id}</td><td>${Number(r.total).toFixed(2)}</td><td>${r.created_at}</td>`; tbody.appendChild(tr); }); }catch(e){}}
    loadRemitoHelpers();
  </script>
</body>
</html>
