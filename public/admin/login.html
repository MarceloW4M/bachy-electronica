<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Bachy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/admin.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-body p-4 login-panel">
            <div class="login-content">
              <form id="login-form" class="mx-auto">
                <div class="mb-3">
                  <label class="form-label">Usuario</label>
                  <input id="username" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Contraseña</label>
                  <input id="password" type="password" class="form-control" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Entrar</button>
              </form>
              <div id="error" class="text-danger mt-3 small text-center"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/admin/login.js"></script>
  <script>
    // Verificar carga del logo y mostrar estado
    (function(){
      const status = document.getElementById('logoStatus'); const img = new Image();
      img.onload = ()=>{ if(status) status.textContent = 'OK'; };
      img.onerror = ()=>{ if(status) status.textContent = 'Error cargando imagen'; };
      img.src = '/img/logo.png';
    })();
  </script>
</body>
</html>
