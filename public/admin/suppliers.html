<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Proveedores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/admin.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="adminNavbar"></div>
  <script src="/admin/navbar.js"></script>

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4">Proveedores</h1>
      <div><button id="btnNew" class="btn btn-success">Nuevo proveedor</button></div>
    </div>
    <div class="card">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0" id="listTable">
            <thead class="table-light">
              <tr><th>ID</th><th>Nombre</th><th>Teléfono</th><th>Email</th><th class="text-end">Acciones</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Proveedor</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="form">
            <input type="hidden" id="id">
            <div class="mb-3"><label class="form-label">Nombre</label><input id="name" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Dirección</label><input id="address" class="form-control"></div>
            <div class="mb-3"><label class="form-label">CUIT</label><input id="cuit" class="form-control"></div>
            <div class="mb-3"><label class="form-label">Teléfono</label><input id="phone" class="form-control"></div>
            <div class="mb-3"><label class="form-label">Contacto</label><input id="contact" class="form-control"></div>
            <div class="mb-3"><label class="form-label">Teléfono de contacto</label><input id="contact_phone" class="form-control"></div>
            <div class="mb-3"><label class="form-label">Email</label><input id="email" class="form-control" type="email"></div>
            <div class="mb-3"><label class="form-label">Provincia</label><select id="provinceId" class="form-select"><option value="">Sin asignar</option></select></div>
            <div class="mb-3"><label class="form-label">Ciudad</label><select id="cityId" class="form-select"><option value="">Sin asignar</option></select></div>
            <div class="mb-3"><label class="form-label">Código postal</label><input id="postal_code" class="form-control"></div>
            <div class="form-check"><input id="active" class="form-check-input" type="checkbox" checked><label class="form-check-label">Activo</label></div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button id="save" class="btn btn-primary">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="position-fixed bottom-0 end-0 p-3" style="z-index:1100"><div id="toastContainer"></div></div>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/admin-utils.js"></script>
  <script src="/js/admin-nav-active.js"></script>
  <script>
    const api = '/api/suppliers.php';
    const modal = new bootstrap.Modal(document.getElementById('modal'));

    function getAuth(){
      const token = localStorage.getItem('token');
      return token ? { Authorization: 'Bearer ' + token } : {};
    }

    async function load(){
      try{
        const res = await axios.get(api + '?all=1', { headers: getAuth() });
        const tbody = document.querySelector('#listTable tbody');
        tbody.innerHTML = '';
        (res.data || []).forEach(r => {
          const include = (typeof r.active === 'undefined') || (r.active==1);
          if(!include) return;
          const tr = document.createElement('tr');
          const tdId = document.createElement('td'); tdId.textContent = r.id;
          const tdName = document.createElement('td'); tdName.innerHTML = escapeHtml(r.name || '');
          const tdPhone = document.createElement('td'); tdPhone.innerHTML = escapeHtml(r.phone || '');
          const tdEmail = document.createElement('td'); tdEmail.innerHTML = escapeHtml(r.email || '');
          const tdActions = document.createElement('td'); tdActions.className = 'text-end';
          const wrap = document.createElement('div'); wrap.className = 'd-flex justify-content-end gap-2';
          const btnEdit = document.createElement('button'); btnEdit.className = 'btn btn-sm btn-primary btn-action btn-edit'; btnEdit.dataset.id = r.id; btnEdit.textContent = 'Editar';
          const btnDel = document.createElement('button'); btnDel.className = 'btn btn-sm btn-danger btn-action btn-del'; btnDel.dataset.id = r.id; btnDel.textContent = r.active == 1 ? 'Desactivar' : 'Eliminar';
          wrap.appendChild(btnEdit); wrap.appendChild(btnDel); tdActions.appendChild(wrap);
          tr.appendChild(tdId); tr.appendChild(tdName); tr.appendChild(tdPhone); tr.appendChild(tdEmail); tr.appendChild(tdActions);
          tbody.appendChild(tr);
        });
      }catch(e){
        showToast('Error cargando proveedores', 'danger');
      }
    }

    document.getElementById('btnNew').addEventListener('click', () => {
      document.getElementById('form').reset();
      document.getElementById('id').value = '';
      document.getElementById('active').checked = true;
      loadProvinces();
      loadCities();
      modal.show();
    });

    document.getElementById('save').addEventListener('click', async () => {
      const id = document.getElementById('id').value || null;
      const payload = {
        name: document.getElementById('name').value.trim(),
        address: document.getElementById('address').value.trim(),
        cuit: document.getElementById('cuit').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        contact: document.getElementById('contact').value.trim(),
        contact_phone: document.getElementById('contact_phone').value.trim(),
        email: document.getElementById('email').value.trim(),
        province_id: document.getElementById('provinceId').value || null,
        city_id: document.getElementById('cityId').value || null,
        postal_code: document.getElementById('postal_code').value.trim(),
        active: document.getElementById('active').checked ? 1 : 0
      };

      if(!payload.name){
        showToast('Nombre obligatorio', 'warning');
        return;
      }

      try{
        if(id) await axios.put(api + '?id=' + id, payload, { headers: getAuth() });
        else await axios.post(api, payload, { headers: getAuth() });
        modal.hide();
        load();
        showToast('Guardado', 'success');
      }catch(e){
        showToast('Error guardando', 'danger');
      }
    });

    document.querySelector('#listTable tbody').addEventListener('click', async (e) => {
      const t = e.target;

      if(t.classList.contains('btn-edit')){
        const id = t.dataset.id;
        try{
          const res = await axios.get(api + '?id=' + id, { headers: getAuth() });
          const d = res.data;
          document.getElementById('id').value = d.id;
          document.getElementById('name').value = d.name || '';
          document.getElementById('address').value = d.address || '';
          document.getElementById('cuit').value = d.cuit || '';
          document.getElementById('phone').value = d.phone || '';
          document.getElementById('contact').value = d.contact || '';
          document.getElementById('contact_phone').value = d.contact_phone || '';
          document.getElementById('email').value = d.email || '';
          document.getElementById('postal_code').value = d.postal_code || '';
          document.getElementById('active').checked = d.active == 1;
          await loadProvinces();
          if(d.province_id) document.getElementById('provinceId').value = d.province_id;
          await loadCities(d.province_id);
          if(d.city_id) document.getElementById('cityId').value = d.city_id;
          modal.show();
        }catch(e){
          showToast('Error cargando proveedor', 'danger');
        }
      }

      if(t.classList.contains('btn-del')){
        const id = t.dataset.id;
        if(!confirm('Confirmar desactivación?')) return;
        try{
          await axios.delete(api + '?id=' + id, { headers: getAuth() });
          load();
          showToast('Desactivado', 'success');
        }catch(e){
          showToast('Error al desactivar', 'danger');
        }
      }
    });

    load();
    async function loadProvinces(){
      try{
        const res = await axios.get('/api/provinces.php?all=1', { headers: getAuth() });
        const sel = document.getElementById('provinceId'); if(!sel) return;
        const cur = sel.value; sel.innerHTML = '<option value="">Sin asignar</option>';
        (res.data||[]).forEach(p=>{ const o=document.createElement('option'); o.value=p.id; o.text=p.name; sel.appendChild(o); });
        if(cur) sel.value = cur;
      }catch(e){}
    }

    async function loadCities(provinceId){
      try{
        const sel = document.getElementById('cityId'); if(!sel) return;
        const cur = sel.value; sel.innerHTML = '<option value="">Sin asignar</option>';
        let url = '/api/cities.php?all=1';
        if(provinceId) url = '/api/cities.php?province_id=' + provinceId;
        const res = await axios.get(url, { headers: getAuth() });
        (res.data||[]).forEach(c=>{ const o=document.createElement('option'); o.value=c.id; o.text=c.name; sel.appendChild(o); });
        if(cur) sel.value = cur;
      }catch(e){}
    }

    document.getElementById('provinceId').addEventListener('change', (e)=>{ loadCities(e.target.value); });
  </script>
</body>
</html>
