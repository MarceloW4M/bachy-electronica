<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Artículos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/admin.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="/admin/dashboard.html">Admin</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="stockDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">Stock</a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="stockDropdown">
              <li><a class="dropdown-item" href="/admin/brands.html">Marcas</a></li>
              <li><a class="dropdown-item" href="/admin/models.html">Modelos</a></li>
              <li><a class="dropdown-item" href="/admin/categories.html">Rubros</a></li>
              <li><a class="dropdown-item" href="/admin/items.html">Artículos</a></li>
              <li><a class="dropdown-item" href="/admin/warehouses.html">Depósitos</a></li>
              <li><a class="dropdown-item" href="/admin/suppliers.html">Proveedores</a></li>
            </ul>
          </li>
          <li class="nav-item"><a class="nav-link" href="/admin/dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin/clients.html">Clientes</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin/devices.html">Dispositivos</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="repairsDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">Reparaciones</a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="repairsDropdown">
              <li><a class="dropdown-item" href="/admin/repairs.html">Lista de reparaciones</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="/admin/technicians.html">Técnicos</a></li>
            </ul>
          </li>
          <li class="nav-item"><button id="logout" class="btn btn-outline-light btn-sm ms-3">Cerrar sesión</button></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4">Artículos</h1>
      <div><button id="btnNew" class="btn btn-success">Nuevo artículo</button></div>
    </div>
    <div class="card">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0" id="listTable">
            <thead class="table-light">
              <tr><th>ID</th><th>Nombre</th><th>SKU</th><th>Rubro</th><th>Activo</th><th>Acciones</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Artículo</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="form">
            <input type="hidden" id="id">
            <div class="mb-3"><label class="form-label">Nombre</label><input id="name" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">SKU</label><input id="sku" class="form-control"></div>
            <div class="mb-3"><label class="form-label">Rubro</label><select id="categoryId" class="form-select"><option value="">Sin asignar</option></select></div>
            <div class="form-check"><input id="active" class="form-check-input" type="checkbox" checked><label class="form-check-label">Activo</label></div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button id="save" class="btn btn-primary">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="position-fixed bottom-0 end-0 p-3" style="z-index:1100"><div id="toastContainer"></div></div>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/admin-utils.js"></script>
  <script src="/js/admin-nav-active.js"></script>
  <script>
    const api = '/api/items.php';
    const modal = new bootstrap.Modal(document.getElementById('modal'));

    function getAuth(){
      const token = localStorage.getItem('token');
      return token ? { Authorization: 'Bearer ' + token } : {};
    }

    async function load(){
      try{
        const res = await axios.get(api + '?all=1', { headers: getAuth() });
        const tbody = document.querySelector('#listTable tbody');
        tbody.innerHTML = '';
        (res.data || []).forEach(r => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${r.id}</td><td>${escapeHtml(r.name || '')}</td><td>${escapeHtml(r.sku || '')}</td><td>${escapeHtml(r.category_name||'')}</td><td>${r.active == 1 ? '<span class="badge bg-success">Sí</span>' : '<span class="badge bg-secondary">No</span>'}</td><td><button class="btn btn-sm btn-primary btn-edit" data-id="${r.id}">Editar</button> <button class="btn btn-sm btn-danger btn-del" data-id="${r.id}">${r.active == 1 ? 'Desactivar' : 'Eliminar'}</button></td>`;
          tbody.appendChild(tr);
        });
      }catch(e){
        showToast('Error cargando artículos', 'danger');
      }
    }

    document.getElementById('btnNew').addEventListener('click', () => {
      document.getElementById('form').reset();
      document.getElementById('id').value = '';
      document.getElementById('active').checked = true;
      loadCategories();
      modal.show();
    });

    document.getElementById('save').addEventListener('click', async () => {
      const id = document.getElementById('id').value || null;
      const payload = {
        name: document.getElementById('name').value.trim(),
        sku: document.getElementById('sku').value.trim(),
        category_id: document.getElementById('categoryId').value || null,
        active: document.getElementById('active').checked ? 1 : 0
      };

      if(!payload.name){
        showToast('Nombre obligatorio', 'warning');
        return;
      }

      try{
        if(id) await axios.put(api + '?id=' + id, payload, { headers: getAuth() });
        else await axios.post(api, payload, { headers: getAuth() });
        modal.hide();
        load();
        showToast('Guardado', 'success');
      }catch(e){
        showToast('Error guardando', 'danger');
      }
    });

    document.querySelector('#listTable tbody').addEventListener('click', async (e) => {
      const t = e.target;

      if(t.classList.contains('btn-edit')){
        const id = t.dataset.id;
        try{
          const res = await axios.get(api + '?id=' + id, { headers: getAuth() });
          const d = res.data;
          document.getElementById('id').value = d.id;
          document.getElementById('name').value = d.name || '';
          document.getElementById('sku').value = d.sku || '';
          document.getElementById('active').checked = d.active == 1;
          await loadCategories();
          document.getElementById('categoryId').value = d.category_id || '';
          modal.show();
        }catch(e){
          showToast('Error cargando artículo', 'danger');
        }
      }

      if(t.classList.contains('btn-del')){
        const id = t.dataset.id;
        if(!confirm('Confirmar desactivación?')) return;
        try{
          await axios.delete(api + '?id=' + id, { headers: getAuth() });
          load();
          showToast('Desactivado', 'success');
        }catch(e){
          showToast('Error al desactivar', 'danger');
        }
      }
    });

    load();
    async function loadCategories(){
      try{
        const res = await axios.get('/api/categories.php?all=1', { headers: getAuth() });
        const sel = document.getElementById('categoryId');
        if(!sel) return;
        const cur = sel.value;
        sel.innerHTML = '<option value="">Sin asignar</option>';
        (res.data||[]).forEach(c=>{ const o=document.createElement('option'); o.value=c.id; o.text=c.name; sel.appendChild(o); });
        if(cur) sel.value = cur;
      }catch(e){ }
    }
    loadCategories();
  </script>
</body>
</html>
